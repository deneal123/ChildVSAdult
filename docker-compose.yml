services:
  prom-model-init:
    build:
      context: .
      target: model-init
    env_file: ${PROM_ENV_FILE:-.env}
    volumes:
      - prom-model-artifacts:/app/models
    command: ["prom-model-init"]
    restart: "no"

  prom-migrate:
    build: .
    env_file: ${PROM_ENV_FILE:-.env}
    volumes:
      - prom-model-artifacts:/app/models:ro
    command: ["prom-migrate"]
    depends_on:
      prom-model-init:
        condition: service_completed_successfully
    restart: "no"

  prom-api:
    build: .
    env_file: ${PROM_ENV_FILE:-.env}
    volumes:
      - prom-model-artifacts:/app/models:ro
    command: ["prom-api"]
    depends_on:
      prom-model-init:
        condition: service_completed_successfully
      prom-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  prom-worker:
    build: .
    env_file: ${PROM_ENV_FILE:-.env}
    volumes:
      - prom-model-artifacts:/app/models:ro
    command: ["prom-worker"]
    depends_on:
      prom-model-init:
        condition: service_completed_successfully
      prom-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  prom-model-artifacts:
