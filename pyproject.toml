[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dating-prom"
version = "1.0.0"
description = "Internal, consent-bounded recommendation service for a dating application."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "Pillow>=10,<12",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "httpx>=0.27,<1",
]
model-init = [
    "torch>=2.5,<2.6",
    "huggingface-hub>=0.26,<1",
    "onnx>=1.16,<2",
    "transformers>=4.45,<5",
]

[project.scripts]
prom-api = "prom_service.app:run"
prom-worker = "prom_service.worker:run"
prom-migrate = "prom_service.migrate:main"
prom-verify-artifacts = "prom_service.artifacts:main"
prom-model-init = "prom_service.model_init:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["prom_service"]
