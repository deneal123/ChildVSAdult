[default]

[default.logs]
level = "INFO"
file = "logs/research.jsonl"

# ── ОБЩИЕ настройки ─────────────────────────
[default.base]

# Устройство вычислений: "auto" | "cpu" | "cuda".
# auto использует GPU, если доступен CUDAExecutionProvider (onnxruntime-gpu) / torch.cuda.
[default.compute]
device = "auto"

[default.paths]
data_dir = "data"
prepared_dir = "prepared"
output_dir = "output"
embeddings_cache_dir = "cache/embeddings"
models_dir = "models"
metrics_dir = "metrics"
splits_dir = "splits"
predictions_dir = "predictions"

[default.gigachat]
model_name = "GigaChat-2-Max"
scope = "GIGACHAT_API_CORP"
verify_ssl = false
cert_path = 'certs/russian_trusted_root_ca_pem.crt'   # относительно папки settings; абсолютный путь тоже допустим
api_endpoint = "https://gigachat.devices.sberbank.ru/api/v1/"
auth_endpoint = "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"

[default.gigachat.embeddings]
batch_size = 16          # сколько текстов отправляем в одном запросе эмбеддингов
max_concurrency = 8      # сколько запросов эмбеддингов выполняем одновременно (asyncio)

# Единый ретрай для ВСЕХ запросов GigaChat (chat/achat_raw/embeddings): 429/5xx/таймауты/сеть.
# Уважает Retry-After; 400/401/403/404/422 и 413 не повторяет. Покрывает все эксперименты.
[default.gigachat.retry]
max_attempts = 6         # суммарно попыток (1 основная + 5 повторов)
base_delay = 1.0         # стартовая задержка, сек (экспонента ×multiplier)
max_delay = 30.0         # потолок задержки, сек
multiplier = 2.0
jitter = 0.5             # доля случайного разброса сверху (спасает от синхронных 429 при concurrency)

[default.gigachat.llm_params]
temperature = 1e-5
top_p = 0
max_gen_tokens = 10000
max_embed_tokens = 512
repetition_penalty = 1
profanity_check = false

# ── Reddit кросс-платформенный workspace ────────────────────────────────────
# Отдельный data-root, чтобы прогнать весь пайплайн на не-VK источнике (Reddit),
# не затирая VK-данные/сплит. Наследует остальные пути из [default.paths].
# Активация для всех reddit-шагов: ENV_FOR_DYNACONF=reddit (PowerShell: $env:ENV_FOR_DYNACONF="reddit").
[reddit.paths]
dynaconf_merge = true                 # наследовать остальные пути из [default.paths]
data_dir = "data_reddit"
splits_dir = "data_reddit/splits"

# ── natural_faces: второй VK-домен для ветки engagement ─────────────────────
# Другой паблик (vk.com/natural_faces, owner_id=-196079461): портреты, без «тогда/сейчас».
# ВАЖНО: разводим не только data_dir, но и кэш эмбеддингов и metrics_dir — иначе
# прогон затрёт артефакты основного исследования.
# Активация: $env:ENV_FOR_DYNACONF="natural"
[natural.paths]
dynaconf_merge = true
data_dir = "data_natural"
splits_dir = "data_natural/splits"
embeddings_cache_dir = "data_natural/cache/embeddings"
metrics_dir = "metrics_natural"